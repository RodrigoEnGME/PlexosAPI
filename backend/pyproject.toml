[project]
name = "sddp-plexos-converter-api"
version = "0.1.0"
description = "API and conversion core for SDDP to PLEXOS migration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "lxml>=5.3,<6.0",
  "charset-normalizer>=3.4,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "pyright>=1.1,<2.0",
]
data = [
  "pandas>=2.2,<3.0",
  "polars>=1.20,<2.0",
]
docs = [
  "markitdown[pdf]>=0.1.7,<0.2",
]
plexos9 = [
  "pythonnet>=3.0,<4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
